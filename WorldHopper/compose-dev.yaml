services:
  backend:
    build:
      context: backend
      dockerfile: ./backend.Dockerfile
    image: worldhopper-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      WorldHopper__DataPath: /data
    volumes:
      - ${WORLDHOPPER_DATA_PATH:-./.worldhopper-data}:/data:ro
  frontend:
    build:
      context: frontend
      dockerfile: ./frontend.Dockerfile
    image: worldhopper-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
  # One-shot data pipeline: `docker compose -f compose-dev.yaml run --rm geocode`.
  # Mounts the data dir read-write so it can write the generated CSVs and the geocoding cache.
  geocode:
    build:
      context: backend
      dockerfile: ./geocode.Dockerfile
    image: worldhopper-geocode
    profiles: ["tools"]
    environment:
      WorldHopper__DataPath: /data
    volumes:
      - ${WORLDHOPPER_DATA_PATH:-./.worldhopper-data}:/data
