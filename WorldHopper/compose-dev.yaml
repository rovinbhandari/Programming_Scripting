services:
  backend:
    build:
      context: backend
      dockerfile: ./backend.Dockerfile
    image: worldhopper-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
  frontend:
    build:
      context: frontend
      dockerfile: ./frontend.Dockerfile
    image: worldhopper-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend